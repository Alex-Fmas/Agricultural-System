
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设施棚室监测系统</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f2f6f2;
            min-height: 100vh;
        }

        header {
            background: #246b45;
            color: white;
            padding: 22px 8%;
            box-shadow: 0 2px 8px #00000015;
        }

        header h2 {
            font-size: 23px;
            letter-spacing: 2px;
        }

        main {
            max-width: 900px;
            margin: 100px auto;
            padding: 20px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 65px 25px;
            text-align: center;
            box-shadow: 0 5px 20px #0000000d;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 25px;
        }

        h1 {
            color: #246b45;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .status {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 30px;
            background: #e4f5e9;
            color: #25834a;
            font-size: 15px;
        }

        .description {
            color: #888;
            margin-top: 25px;
            line-height: 1.8;
        }

        footer {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 60px;
        }
    </style>
</head>

<body>

<header>
    <h2>GREENHOUSE MONITORING SYSTEM</h2>
</header>

<main>
    <section class="panel">

        <div class="icon">🌱</div>

        <h1>设施棚室监测系统——环境就绪</h1>

        <div class="status">
            ● 系统运行正常
        </div>

        <p class="description">
            欢迎使用设施棚室监测系统。<br>
            系统已准备就绪，可以开始进行环境监测。
        </p>

    </section>

    <footer>
        设施棚室监测系统 &copy; 2026
    </footer>
</main>

</body>
</html>
